name: gunindex
x-app: &app
  image: gunindex-production:${RELEASE_ID:?RELEASE_ID missing}
  build:
    context: ${APP_SOURCE:?APP_SOURCE missing}
    dockerfile: ops/production/Dockerfile
    secrets: [proxy_ca]
  env_file: ["${ENV_DIR:?ENV_DIR missing}/app.env"]
  user: "33:33"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=33,gid=33,mode=0700"]
  volumes:
    - private:/var/lib/gunindex
    - ${ENV_DIR}/msmtprc:/etc/msmtprc:ro
  networks:
    backend: {ipv4_address: "${APP_IP:-172.30.81.10}"}
    frontend: {}
  restart: unless-stopped
  stop_grace_period: 90s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    env_file: ["${ENV_DIR}/database.env"]
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--default-time-zone=+00:00","--local-infile=0"]
    volumes: [database:/var/lib/mysql]
    networks:
      backend: {ipv4_address: "${DB_IP:-172.30.81.30}"}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  php:
    <<: *app
    stop_signal: SIGQUIT
    depends_on: [db]
  worker:
    <<: *app
    depends_on: [db]
    entrypoint: ["/bin/sh","/app/ops/production/worker.sh"]
    networks:
      backend: {ipv4_address: "${WORKER_IP:-172.30.81.11}"}
      frontend: {}
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: "101:101"
    entrypoint: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=0700"]
    ports: ["80:8080","443:8443"]
    volumes:
      - ${ENV_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INSTALL_DIR}/acme:/run/acme:ro
      - ${INSTALL_DIR}/tls:/run/tls:ro
    networks: [frontend]
    depends_on: [php]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  mailer:
    build:
      context: ${APP_SOURCE}
      dockerfile: ops/production/Dockerfile.mailer
      secrets: [proxy_ca]
    environment:
      MAIL_HOSTNAME: mail.${DOMAIN:?DOMAIN missing}
      MAIL_DOMAIN: ${DOMAIN}
      TRUSTED_APP_IP: ${APP_IP:-172.30.81.10}
      TRUSTED_WORKER_IP: ${WORKER_IP:-172.30.81.11}
    volumes: [mailqueue:/var/spool/postfix]
    networks:
      backend: {ipv4_address: "${MAIL_IP:-172.30.81.20}"}
      mail_egress: {}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backup:
    <<: *app
    profiles: [ops]
    user: "0:0"
    restart: "no"
    cap_add: [DAC_READ_SEARCH]
    tmpfs: []
    volumes:
      - private:/var/lib/gunindex:ro
      - ${KEY_DIR:?KEY_DIR missing}/backup.key:/run/backup.key:ro
      - backup_tmp:/tmp
    networks:
      backend: {}
    entrypoint: ["/bin/sh","/app/ops/production/backup-entrypoint.sh"]
  maintenance:
    <<: *app
    profiles: [ops]
    restart: "no"
    networks:
      backend: {}
volumes:
  database: {}
  private: {}
  mailqueue: {}
  backup_tmp: {}
networks:
  backend:
    internal: true
    ipam:
      config: [{subnet: "${BACKEND_SUBNET:-172.30.81.0/24}"}]
  frontend: {}
  mail_egress: {}
secrets:
  proxy_ca:
    file: ${BUILD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
