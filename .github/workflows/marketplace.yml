name: Marketplace regressions
on:
  pull_request:
  push:
    branches: [main, feature/general-marketplace-rebuild]
permissions:
  contents: read
jobs:
  windows-preflight:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read-only Windows prerequisite checks
        shell: powershell
        run: ./tests/windows_preflight_test.ps1
      - name: Reject native Windows runtime operations
        run: python tests/runtime_platform_test.py
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Runtime platform guard
        run: python3 tests/runtime_platform_test.py
      - name: Read-only postcode validator regressions
        run: node tests/postcodes_validation_test.mjs
      - name: Isolated PHP and MySQL checks
        run: python3 tests/environment.py test
      - name: Audit locked PHP dependencies
        run: docker --host=unix:///var/run/docker.sock exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app gunindex-rebuild-app composer audit --locked --no-dev --no-interaction
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/browser-tools
          tests/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser, international controls and automated accessibility
        run: |
          node tests/browser_smoke.js
          node tests/international_smoke.js
          node tests/accessibility_smoke.js
      - name: Stop test services and retain their data
        if: always()
        run: python3 tests/environment.py stop
