name: Marketplace regressions
on:
  pull_request:
  push:
    branches: [main, feature/general-marketplace-rebuild]
permissions:
  contents: read
jobs:
  windows-preflight:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read-only Windows prerequisite checks
        shell: powershell
        run: ./tests/windows_preflight_test.ps1
      - name: Reject native Windows runtime operations
        run: python tests/runtime_platform_test.py
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Runtime platform guard
        run: python3 tests/runtime_platform_test.py
      - name: Read-only postcode validator regressions
        run: |
          node tests/postcodes_validation_test.mjs
          node tests/nl_postcodes_preparation_test.mjs
      - name: Locked client cryptography and genuine multi-device tests
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev
          node ops/vendor-e2ee.mjs --check
          node tests/e2ee_crypto_test.mjs
      - name: Isolated PHP and MySQL checks
        run: python3 tests/environment.py test
      - name: Audit locked PHP dependencies
        run: docker --host=unix:///var/run/docker.sock exec -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app gunindex-rebuild-app composer audit --locked --no-dev --no-interaction
      - name: Bitcoin Core offline regtest
        run: bash tests/bitcoin_regtest.sh
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/browser-tools
          tests/browser-tools/node_modules/.bin/playwright install chromium
          # Install system packages if the pinned browser cannot run on this image.
          if ! node -e 'const {playwright, launchOptions} = require("./tests/browser_tools"); playwright.chromium.launch({...launchOptions(), timeout: 10000}).then(browser => browser.close()).catch(error => { console.error(error.message); process.exitCode = 1; });'; then
            tests/browser-tools/node_modules/.bin/playwright install-deps chromium
          fi
      - name: Browser, international controls and automated accessibility
        run: |
          node tests/banner_country_browser.js
          node tests/browser_smoke.js
          node tests/auction_billing_browser.js
          node tests/trade_browser.js
          node tests/classification_browser.js
          node tests/listing_draft_browser.js
          node tests/auth_session_browser.js
          node tests/user_security_browser.js
          node tests/profile_images_browser.js
          node tests/e2ee_browser.js
          node tests/international_smoke.js
          node tests/accessibility_smoke.js
      - name: Install Firefox and WebKit for encrypted chat checks
        run: tests/browser-tools/node_modules/.bin/playwright install --with-deps firefox webkit
      - name: Encrypted chat between different browser engines
        run: |
          GUNINDEX_E2EE_PEER_BROWSER=firefox node tests/e2ee_browser.js
          GUNINDEX_E2EE_PEER_BROWSER=webkit node tests/e2ee_browser.js
      - name: Stop test services and retain their data
        if: always()
        run: python3 tests/environment.py stop
